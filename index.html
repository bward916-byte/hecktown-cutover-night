<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hecktown Road: Cutover Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#101a2e; --panel:rgba(16,26,46,.86); --cream:#f6ecd8; --dim:#b9b09a; --gold:#f2b544; --rust:#7a3b2a; --green:#6fe08a; --page:#0b1220;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    box-sizing:border-box; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0b1220; } }
  :root[data-theme="dark"]{ --page:#0b1220; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--page);}
  body{font-family:var(--sans);color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .hide{display:none !important;}

  /* ---- HUD ---- */
  #hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;
       padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));}
  .chip{background:var(--panel);border-radius:6px;padding:7px 11px;pointer-events:auto;line-height:1.25;}
  #where b{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:15px;display:block;}
  #where span{font-size:12.5px;color:var(--cream);}
  #goal{flex:1;min-width:0;font-size:13px;color:var(--cream);max-width:560px;margin:0 auto;}
  #goal i{font-style:normal;color:var(--dim);font-size:11px;display:block;}
  #score{text-align:right;min-width:150px;border:0;}
  #score b{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--gold);}
  #score span{font-size:11.5px;color:var(--dim);display:block;}
  #bar{height:4px;background:rgba(246,236,216,.16);border-radius:2px;margin-top:5px;overflow:hidden;} #bar div{height:100%;background:var(--gold);width:0;transition:width .5s;}
  #tools{display:flex;gap:6px;position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(74px + env(safe-area-inset-top,0px));}
  #tools button{background:var(--panel);border:0;border-radius:6px;padding:6px 10px;font-size:12px;}
  #saved{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));font-size:11px;color:var(--dim);opacity:0;transition:opacity .4s;}
  #saved.on{opacity:1;}

  #toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px);}
  .toast{background:var(--panel);border-left:3px solid var(--gold);border-radius:4px;padding:7px 12px;font-size:13.5px;animation:tin .25s ease-out;}
  .toast b{font-family:var(--mono);color:var(--gold);margin-right:8px;}
  .toast.hint{border-left-color:var(--dim);color:var(--dim);}
  @keyframes tin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

  /* ---- dialog ---- */
  #dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(94vw,640px);background:var(--panel);border-radius:8px;border-top:3px solid var(--gold);
          padding:12px 14px;display:flex;gap:12px;cursor:pointer;z-index:5;}
  #dialog canvas{width:56px;height:56px;flex:none;background:rgba(246,236,216,.08);border-radius:6px;}
  #dwho{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--gold);letter-spacing:.01em;} #dwho span{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--dim);margin-left:8px;}
  #dtext{font-size:15.5px;line-height:1.45;margin:3px 0 6px;min-height:2.9em;}
  #dialog.term #dtext{font-family:var(--mono);color:var(--green);font-size:14.5px;}
  #dmore{font-size:11.5px;color:var(--dim);}
  #dchoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;} #dchoices button{background:var(--gold);color:var(--navy);border:0;border-radius:5px;padding:8px 12px;font-weight:600;font-size:14px;}
  #dchoices button+button{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1px var(--dim);}

  /* ---- touch pad ---- */
  #pad{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,auto);gap:8px;justify-items:end;align-items:end;}
  body.touch #pad{display:grid;}
  #pad button{width:62px;height:62px;border-radius:50%;border:2px solid rgba(246,236,216,.4);background:rgba(16,26,46,.62);font-family:var(--cond);font-weight:700;font-size:13px;touch-action:none;}
  #pad button.big{width:76px;height:76px;background:rgba(242,181,68,.9);color:var(--navy);border-color:transparent;font-size:15px;}
  #pad button[aria-pressed="true"]{background:var(--cream);color:var(--navy);}
  #pad .more{display:none;} #pad.open .more{display:block;} #bMore{grid-column:3;} body.talking #pad{display:none;}

  /* ---- overlays ---- */
  .overlay{position:fixed;inset:0;z-index:10;overflow:auto;-webkit-overflow-scrolling:touch;
           padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));}
  #title{background:linear-gradient(90deg,rgba(11,18,32,.94) 0%,rgba(11,18,32,.80) 46%,rgba(11,18,32,.15) 100%);display:flex;align-items:flex-end;}
  #title .in{max-width:520px;padding-bottom:4vh;}
  #title h1{font-family:var(--cond);font-weight:700;font-size:clamp(44px,9vw,84px);line-height:.92;margin:0;letter-spacing:-.01em;color:var(--cream);}
  #title h2{font-family:var(--mono);font-weight:500;font-size:clamp(14px,2.4vw,18px);color:var(--green);margin:12px 0 18px;}
  #title p{font-size:15.5px;line-height:1.55;color:var(--cream);margin:0 0 20px;max-width:46ch;}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .btn{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:12px 20px;font-weight:600;font-size:16px;}
  .btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--dim);}
  #resume{font-size:13px;color:var(--dim);margin:-8px 0 16px;}
  .keys{font-size:12.5px;color:var(--dim);line-height:1.7;} .keys kbd{font-family:var(--mono);font-size:11.5px;background:rgba(246,236,216,.12);border-radius:3px;padding:1px 5px;color:var(--cream);}

  #journal,#ending{background:rgba(11,18,32,.96);}
  .sheet{max-width:760px;margin:0 auto;}
  .sheet h1{font-family:var(--cond);font-weight:700;font-size:34px;margin:0 0 2px;} .sheet h3{font-family:var(--cond);font-weight:600;font-size:19px;color:var(--gold);margin:24px 0 8px;}
  .sheet .sub{color:var(--dim);font-size:13.5px;margin-bottom:14px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
  .stat{background:rgba(246,236,216,.07);border-radius:6px;padding:10px 12px;} .stat b{font-family:var(--mono);font-size:20px;color:var(--cream);display:block;} .stat span{font-size:12px;color:var(--dim);}
  .task{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(246,236,216,.10);font-size:14.5px;} .task .mark{font-family:var(--mono);width:2.2em;flex:none;color:var(--dim);white-space:nowrap;}
  .task.done .mark{color:var(--green);} .task.active .mark{color:var(--gold);} .task.todo{opacity:.5;} .task small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;}
  .places{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px;font-size:13.5px;} .places div.un{color:rgba(246,236,216,.3);} .places b{display:block;font-family:var(--cond);color:var(--cream);margin-top:10px;}
  .page{font-size:14px;line-height:1.5;padding:7px 0 7px 12px;border-left:2px solid var(--rust);margin-bottom:8px;color:var(--cream);}
  .close{position:sticky;top:0;float:right;}
  @media (max-width:640px){ #goal{display:none;} body.play #goal{display:block;position:fixed;left:10px;right:10px;top:calc(58px + env(safe-area-inset-top,0px));max-width:none;font-size:12px;padding:5px 9px;} #tools{top:calc(116px + env(safe-area-inset-top,0px));} #tools button{padding:5px 9px;} #toasts{top:calc(150px + env(safe-area-inset-top,0px));} #dtext{font-size:14.5px;} #saved{display:none;} #score{min-width:0;} }
</style>
</head>
<body>
<canvas id="c" aria-label="Hecktown Road game view"></canvas>

<div id="hud" class="hide">
  <div id="where" class="chip"><b id="hClock">6:00 PM</b><span id="hPlace">HQ Lobby</span></div>
  <div id="goal" class="chip"><i>Next</i><span id="hGoal"></span></div>
  <button id="score" class="chip" title="Open the journal"><b id="hPts">0</b><span id="hRank">New Badge</span><div id="bar"><div id="hBar"></div></div></button>
</div>
<div id="tools" class="hide"><button id="bJournal">Journal</button><button id="bZoom">Zoom</button><button id="bSnd">Sound on</button></div>
<div id="saved">Saved</div>
<div id="toasts" aria-live="polite"></div>

<div id="dialog" class="hide" role="dialog" aria-live="polite">
  <canvas id="dface" width="112" height="112"></canvas>
  <div style="flex:1;min-width:0"><div id="dwho"></div><div id="dtext"></div><div id="dchoices"></div><div id="dmore"></div></div>
</div>

<div id="pad">
  <button class="more" data-act="dance" aria-pressed="false">Dance</button><button class="more" data-act="clap">Clap</button><button class="more" data-act="read" aria-pressed="false">Read</button>
  <button class="more" data-act="throw">Throw</button><button class="more" data-act="roll">Roll</button><button id="bMore" aria-expanded="false">More</button>
  <button data-act="crawl" aria-pressed="false">Crawl</button><button data-act="jump">Jump</button><button class="big" data-act="use">Use</button>
</div>

<div id="title" class="overlay">
  <div class="in">
    <h1>Hecktown<br>Road</h1>
    <h2>&gt; CUTOVER NIGHT_</h2>
    <p>A+ has shipped every order since 1985. At midnight it gets archived, and it would like six signatures first. Walk the Easton campus, floor by floor, and bring everyone along.</p>
    <div class="btns"><button class="btn" id="bContinue">Continue</button><button class="btn" id="bNew">New game</button></div>
    <div id="resume"></div>
    <div class="keys" id="keysHelp"></div>
  </div>
</div>
<div id="journal" class="overlay hide"><div class="sheet" id="jBody"></div></div>
<div id="ending" class="overlay hide"><div class="sheet" id="eBody"></div></div>

<script>
/* ==== 01-walk-engine.js ==== */
/* ==== WALK ENGINE: the Stairwalk motion rig (round two), unchanged except for the world maker. DOM-free. ==== */
(function(root){
'use strict';

/* ---- Everything worth tuning lives here. World units: the character is ~64 tall. ---- */
const CFG = {
  // body
  thigh:15, shin:15, ankleH:3, torso:19, neck:2.6, headR:6.2, upperArm:9.5, foreArm:9,
  footBack:2.5, footBall:4, footToe:6.5,      // sole points measured from under the ankle
  // pace
  walkSpeed:64, accel:160, decel:300,
  cadenceUp:2.15, cadenceDown:2.4,            // treads per second on stairs (sets stair pace from tread width)
  // stepping
  stepMin:10, stepMax:31,                     // step length at a crawl / at full walk
  swingSlow:0.44, swingFast:0.38, swingStair:0.40, swingSettle:0.28,   // seconds a foot spends in the air
  liftSlow:2.5, liftFast:5.5, liftStair:3,    // how high the ankle arcs
  // posture
  crouchIdle:0.6, crouchWalk:1.3,             // how far below "legs locked straight" the hips ride
  heelOff:0.6, heelStrike:0.25, toeFirstUp:0.12, toeFirstDown:0.35,    // foot pitch, radians
  leanSpeed:0.07, leanAccel:0.06, leanClimb:0.17, leanDescend:-0.03,
  armSwing:0.045,
  // jumping
  jumpV:165, gravity:520, jumpRun:78, jumpPrep:0.13, squatJump:7,
  // crawling, rolling, throwing, reading, dancing
  crawlSpeed:20, crawlAccel:110, crawlStride:9,
  rollDist:50, rollTime:0.62,
  throwVx:215, throwVy:-115,
  readSlow:0.55, danceBeat:2
};

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const LEG=CFG.thigh+CFG.shin, LMAX=LEG*0.985;

/* ---------------- World: nothing but level surfaces, sorted left to right. A stair is a run of narrow ones.
   Every floor, landing and flight in the game is one of these; the game layer moves a walker between them. ---------------- */
function makeWorld(s,opt){
  const world=Object.assign({ s:s, x0:s[0].x0+8, x1:s[s.length-1].x1-8,
    indexAt(px){ let lo=0,hi=s.length-1; if(px<=s[0].x0)return 0; if(px>=s[hi].x1)return hi;
      while(lo<hi){ const m=(lo+hi)>>1; if(px>=s[m].x1)lo=m+1; else hi=m; } return lo; },
    yAt(px){ return s[this.indexAt(px)].y; } },opt||{});
  world.hx0=world.x0; world.hx1=world.x1;                 // hard limits; x0/x1 may be pulled in by locked doors
  return world;
}
/* Surfaces from a little script: ['flat',len] and ['stairs',n,tread,rise] (rise>0 climbs to the right). */
function surfaces(x,y,parts){
  const s=[];
  for(const p of parts){
    if(p[0]==='flat'){ s.push({x0:x,x1:x+p[1],y:y,w:p[1]}); x+=p[1]; }
    else{ const n=p[1],tread=p[2],rise=p[3]; for(let i=0;i<n;i++){ y-=rise; if(i<n-1){ s.push({x0:x,x1:x+tread,y:y,w:tread}); x+=tread; } } }
  }
  return s;
}
/* Move a walker onto another world that shares the ground it is standing on. */
function rehome(w,world){
  for(const f of w.feet){ f.si=world.indexAt(f.px); f.tsi=world.indexAt(f.tx); }
}

/* Where may an ankle sit on surface i so the whole boot fits? (dir = which way the toe points) */
function footRange(world,i,dir){
  const f=world.s[i]; let a,b;
  if(dir>0){ a=f.x0+CFG.footBack+0.5; b=f.x1-CFG.footToe-0.5; }
  else     { a=f.x0+CFG.footToe+0.5;  b=f.x1-CFG.footBack-0.5; }
  if(a>b){ a=b=(a+b)/2; }
  return [a,b];
}

/* Ankle position for a planted foot: heel-up pitch pivots on the ball, toe-up pitch pivots on the heel. */
function ankleFor(px,py,pitch,face){
  const c=Math.cos(pitch), sn=Math.sin(pitch);
  if(pitch>=0){ const bx=px+face*CFG.footBall;
    return [bx+face*(-CFG.footBall*c+CFG.ankleH*sn), py-CFG.footBall*sn-CFG.ankleH*c]; }
  const hx=px-face*CFG.footBack;
  return [hx+face*(CFG.footBack*c+CFG.ankleH*sn), py+CFG.footBack*sn-CFG.ankleH*c];
}

function createWalker(world,x){
  const si=world.indexAt(x), gy=world.s[si].y;
  const mk=px=>({px:px,py:gy,si:si,face:1,planted:true,pitch:0,heel:0,landPitch:0,ax:px,ay:gy-CFG.ankleH,
                 settle:false,back:0,lx:0,ly:0,t:0,T:1,sx:0,sy:0,sp:0,tx:px,ty:gy,tsi:si,tax:px,tay:gy-CFG.ankleH,tp:0,lift:0,prof:'flat'});
  const hy=gy-(CFG.ankleH+LEG-CFG.crouchIdle);
  const w={x:x,y:hy,des:hy,by:hy,bv:0,vx:0,dir:1,facing:1,feet:[mk(x-1.6),mk(x+1.6)],arm:[0,0],lean:0,
           kneeF:1,grade:0,stair:0,tread:999,S:CFG.stepMin,thr:2.5,time:0,steps:0,events:[],scarf:[],
           mode:'walk',label:'standing',armB:[0.22,0.22],squat:0,sway:0,headAdd:0,vy:0,landHold:0,landSquat:0,
           jump:null,act:null,reading:false,readT:0,dancing:false,danceT:0,crawl:null,roll:null,fade:null,last:null,shots:[]};
  for(let i=0;i<6;i++){ const p={x:x-2-i*1.5,y:hy-CFG.torso+i*2.5}; p.ox=p.x; p.oy=p.y; w.scarf.push(p); }
  return w;
}

const destX=f=>f.planted?f.px:f.tx;

/* Where should the swinging foot come down? Predict where the hips will be at landing and reach half a step past that. */
function pickTarget(w,world,o,goalV,Trem){
  const dir=w.dir, rate=(Math.abs(goalV)<Math.abs(w.vx)?CFG.decel:CFG.accel)*Trem;
  const dv=clamp(goalV-w.vx,-rate,rate), vLand=w.vx+dv, vAvg=w.vx+dv*0.5;
  const sfL=clamp(Math.abs(vLand)/CFG.walkSpeed,0,1), S=lerp(CFG.stepMin,CFG.stepMax,sfL);
  let xf=w.x+vAvg*Trem+dir*S*0.5;
  const j=o.si; let i=world.indexAt(xf);
  if((i-j)*dir>1) i=j+dir;                              // never skip a tread
  if((i-j)*dir<0) i=j;
  if(i===j && world.s[j].w<20) i=j+dir;                 // narrow tread: one foot each
  i=clamp(i,0,world.s.length-1);
  if(i===j && (xf-o.px)*dir<4) xf=o.px+dir*4;           // always land ahead of the other foot
  const r=footRange(world,i,dir);
  return {i:i,tx:clamp(xf,r[0],r[1]),sf:sfL};
}

/* Point a foot at a landing spot, starting from wherever it is right now. */
function aim(w,world,f,i,tx,T,settle,sf){
  const ty=world.s[i].y, dy=ty-f.py;
  f.prof = dy<-0.5?'up':(dy>0.5?'down':'flat');
  if(f.prof!=='flat' && !settle) T=Math.max(T,CFG.swingStair*(f.planted?1:0.6));
  f.tp = settle?0:(f.prof==='up'?CFG.toeFirstUp:(f.prof==='down'?CFG.toeFirstDown:-CFG.heelStrike*sf));
  f.lift = f.prof==='flat'?(settle?2.2:lerp(CFG.liftSlow,CFG.liftFast,sf)):CFG.liftStair;
  if(!f.planted) f.lift*=0.5;                           // re-aimed in mid-air: no need to arc again
  f.face=w.facing;                                      // a boot turns around when it next leaves the ground
  const a=ankleFor(tx,ty,f.tp,f.face);
  f.planted=false; f.settle=settle; f.t=0; f.T=T; f.sx=f.ax; f.sy=f.ay; f.sp=f.pitch;
  f.tx=tx; f.ty=ty; f.tsi=i; f.tax=a[0]; f.tay=a[1];
  // climbing with the toe already against a riser (it happens after a turn): draw the foot back first
  const sf0=world.s[f.si], edge=f.face>0?sf0.x1:sf0.x0;
  f.back = f.prof==='up' ? Math.max(0,(f.ax+f.face*(CFG.footToe+0.5)-edge)*f.face) : 0;
}

function startStep(w,world,f,o,settle,goalV){
  if(settle){
    const r=footRange(world,o.si,w.facing);
    aim(w,world,f,o.si,clamp(o.px-w.facing*3,r[0],r[1]),CFG.swingSettle,true,0);
  }else{
    const T0=lerp(CFG.swingSlow,CFG.swingFast,clamp(Math.abs(w.vx)/CFG.walkSpeed,0,1));
    const tg=pickTarget(w,world,o,goalV,T0);
    aim(w,world,f,tg.i,tg.tx,T0,false,tg.sf);
  }
}

function swingPose(f){
  const t=f.t; let ux,uy;
  if(f.prof==='up'){        ux=ss((t-0.2)/0.8);   uy=ss(t/0.5);  }       // rise first, then reach
  else if(f.prof==='down'){ ux=ss(t/0.78);        uy=ss((t-0.3)/0.7); }  // reach first, then lower
  else { ux=lerp(t,ss(t),0.75); uy=ux; }
  f.ax=lerp(f.sx,f.tax,ux)-f.face*f.back*ss(t/0.15)*(1-ss((t-0.3)/0.4));
  f.ay=lerp(f.sy,f.tay,uy)-f.lift*Math.sin(Math.PI*Math.pow(t,0.85));
  f.pitch = f.prof==='up' ? lerp(f.sp,f.tp,ss((t-0.25)/0.5))    // keep the toe tucked until it is above the nosing
                          : lerp(f.sp,f.tp,ss(t*1.15));
}

/* =====================  WALKING (feet drive everything)  ===================== */
function stepWalk(w,world,input,dt,o){
  if(input){ w.dir=Math.sign(input); if(w.dir!==w.facing){ startFade(w,0.16); w.facing=w.kneeF=w.dir; } w.dancing=false; }   // a turn swings the limbs across
  const f0=w.feet[0], f1=w.feet[1], S_=world.s;

  // --- read the ground: are we on stairs, and which way do they go?
  const tread=Math.min(S_[world.indexAt(w.x)].w, S_[world.indexAt(w.x+w.dir*12)].w, S_[f0.si].w, S_[f1.si].w);
  const gradeNow=(world.yAt(w.x-w.dir*12)-world.yAt(w.x+w.dir*12))/24;      // + climbing, - descending
  w.grade+=(gradeNow-w.grade)*(1-Math.exp(-6*dt));
  const onStair=tread<40;
  w.stair+=((onStair?1:0)-w.stair)*(1-Math.exp(-7*dt));
  w.tread=tread;
  let vlim=CFG.walkSpeed*(w.reading?CFG.readSlow:1);
  if(onStair) vlim=Math.min(vlim,tread*(w.grade>0?CFG.cadenceUp:CFG.cadenceDown));

  // --- hips, horizontally
  let goal=input*vlim;
  if(!input) goal=clamp(((destX(f0)+destX(f1))/2-w.x)*5,-22,22);             // settle over the feet
  const speedingUp=Math.abs(goal)>Math.abs(w.vx)&&goal*w.vx>=0;
  const a=speedingUp?CFG.accel:CFG.decel, vPrev=w.vx;
  w.vx+=clamp(goal-w.vx,-a*dt,a*dt);
  if(!f0.planted||!f1.planted){                                              // mid-step, hips may not outrun the feet
    const maxD=Math.max(w.thr+3,10);
    for(const f of w.feet){ const d=destX(f)-w.x; if(d*w.vx<0){ const over=Math.abs(d)-maxD; if(over>0){ const cap=CFG.walkSpeed*clamp(1-over/7,0.12,1); w.vx=clamp(w.vx,-cap,cap); } } }
  }
  w.x+=w.vx*dt;
  if(w.x<world.x0){w.x=world.x0; if(w.vx<0)w.vx=0;} if(w.x>world.x1){w.x=world.x1; if(w.vx>0)w.vx=0;}

  const sp=Math.abs(w.vx), sf=clamp(sp/CFG.walkSpeed,0,1);
  w.S=lerp(CFG.stepMin,CFG.stepMax,sf);
  let thrRef=w.S*0.5; if(onStair) thrRef=Math.min(thrRef,tread*0.6);
  const together=f0.planted&&f1.planted&&Math.abs(f0.px-f1.px)<6;
  w.thr=together?2.5:thrRef;

  // --- feet in the air
  for(const f of w.feet) if(!f.planted){
    f.t+=dt/f.T;
    if(f.t>=1){ f.planted=true; f.px=f.tx; f.py=f.ty; f.si=f.tsi; f.landPitch=f.tp; f.heel=0; w.steps++;
      w.events.push({type:'step',x:f.px,y:f.py,speed:sp,stone:S_[f.si].w<40,prof:f.prof}); }
    else{
      if(!f.settle && f.t<0.75){                       // keep correcting the landing spot while there's time
        const ot=f===f0?f1:f0, tg=pickTarget(w,world,ot,goal,(1-f.t)*f.T);
        if(tg.i===f.tsi){ const d=clamp(tg.tx-f.tx,-90*dt,90*dt); f.tx+=d; f.tax+=d; }
        else aim(w,world,f,tg.i,tg.tx,Math.max(0.2,(1-f.t)*f.T),false,tg.sf);
      }
      swingPose(f);
    }
  }
  // --- decide whether a foot should leave the ground
  if(f0.planted&&f1.planted){
    if(input!==0 && w.vx*w.dir>0.5){
      const b0=(w.x-f0.px)*w.dir, b1=(w.x-f1.px)*w.dir;
      // lift the rear foot once it trails far enough, or early if the front foot won't stay ahead for a whole swing
      const lead=-Math.min(b0,b1), Tn=lerp(CFG.swingSlow,CFG.swingFast,sf);
      if(Math.max(b0,b1)>w.thr || (!together && lead<sp*Tn-0.85*w.thr)){ if(b0>=b1) startStep(w,world,f0,f1,false,goal); else startStep(w,world,f1,f0,false,goal); }
    }else if(!input && sp<30){
      if(Math.abs(f0.px-f1.px)>4.5||Math.abs(f0.py-f1.py)>0.5){
        if(f0.px*w.facing<=f1.px*w.facing) startStep(w,world,f0,f1,true,0); else startStep(w,world,f1,f0,true,0);
      }
    }
  }
  // --- feet on the ground: heel peels up as the hips pass ahead (o.tap lets a dance lift a heel too)
  const hRef=Math.max(thrRef,4);
  for(let i=0;i<2;i++){ const f=w.feet[i]; if(!f.planted)continue;
    const behind=(w.x-f.px)*w.dir;
    const hT=(f.face===w.dir?ss((behind-0.4*hRef)/(0.8*hRef))*CFG.heelOff:0)+o.tap[i];
    f.heel+=(hT-f.heel)*(1-Math.exp(-25*dt));
    f.landPitch*=Math.exp(-16*dt);
    f.pitch=f.heel+f.landPitch;
    const an=ankleFor(f.px,f.py,f.pitch,f.face); f.ax=an[0]; f.ay=an[1];
  }

  // --- hips, vertically: ride above the supporting foot, but never further than a leg can reach.
  //     w.squat is extra knee bend asked for by a jump wind-up, a landing, or a dance.
  w.squat+=(o.squat-w.squat)*(1-Math.exp(-(o.squat>w.squat?30:9)*dt));
  let ref=Infinity; for(const f of w.feet) if(f.planted) ref=Math.min(ref,f.py);
  if(ref===Infinity) ref=Math.min(f0.ty,f1.ty);
  for(const f of w.feet) if(!f.planted && f.ty>ref) ref+=(f.ty-ref)*ss(f.t)*0.7;   // start sinking early toward a lower landing
  const crouch=lerp(CFG.crouchIdle,CFG.crouchWalk,sf)+w.stair*0.6+w.squat;
  w.des+=(ref-(CFG.ankleH+LEG-crouch)-w.des)*(1-Math.exp(-(o.squat>0.5?26:10)*dt));
  let target=w.des;
  for(const f of w.feet){ const dx=Math.min(Math.abs(f.ax-w.x),LMAX-3); target=Math.max(target,f.ay-Math.sqrt(LMAX*LMAX-dx*dx)); }
  if(target>w.y) w.y=target; else w.y+=(target-w.y)*(1-Math.exp(-(onStair?10:26)*dt));

  upper(w,dt,o,sf,clamp((w.vx-vPrev)/dt/CFG.accel,-1,1));
  w.label = w.dancing?'dancing':(sp<3&&together ? (w.reading?'reading':'standing') : (onStair&&Math.abs(w.grade)>0.05 ? (w.grade>0?'climbing stairs':'descending stairs') : (sp<3?'standing':(w.reading?'reading on the move':'flat ground'))));

  // --- a jump winds up inside the walk (so the knees bend properly), then leaves the ground
  if(w.jump){ w.jump.t+=dt; if(w.jump.t>=CFG.jumpPrep) launch(w,input); }
}

/* Spring, lean, head, arm targets. Shared by walking and flight. */
function upper(w,dt,o,sf,accN){
  const F=w.facing;
  w.bv+=((w.y-w.by)*480-w.bv*26)*dt; w.by+=w.bv*dt;
  let leanT=(w.vx/CFG.walkSpeed)*CFG.leanSpeed+accN*CFG.leanAccel+F*o.lean;
  if(w.mode==='walk') leanT+=F*w.stair*(w.grade>0.05?CFG.leanClimb:(w.grade<-0.05?CFG.leanDescend:0));
  w.lean+=(leanT-w.lean)*(1-Math.exp(-o.leanRate*dt));
  w.headAdd+=(o.head-w.headAdd)*(1-Math.exp(-9*dt));
  w.sway+=(o.sway-w.sway)*(1-Math.exp(-16*dt));
  const r=1-Math.exp(-o.rate*dt);
  for(let i=0;i<2;i++){
    const rel=(w.feet[i].ax-w.x)*F;
    let ta=w.mode==='air'?0:clamp(-rel*CFG.armSwing,-0.8,0.8)*(0.35+0.65*sf), tb=0.22+Math.max(0,ta)*0.9+sf*0.25;
    const oa=o.arm[i]; if(oa){ ta=lerp(ta,oa.a,oa.k); tb=lerp(tb,oa.b,oa.k); }
    w.arm[i]+=(ta-w.arm[i])*r; w.armB[i]+=(tb-w.armB[i])*r;
  }
}

/* =====================  OVERLAYS: what the arms, head and knees are asked to do on top of walking  =====================
   Arm targets are {a: shoulder angle from hanging (forward +), b: elbow bend, k: how much to override the walk swing}. */
function overlay(w,dt){
  const o={arm:[null,null],lean:0,leanRate:7,head:0,squat:0,sway:0,rate:12,tap:[0,0],prop:null};
  const set=(i,a,b,k)=>{ o.arm[i]={a:a,b:b,k:k==null?1:k}; };
  if(w.landHold>0){ w.landHold-=dt; o.squat=w.landSquat; }
  if(w.reading){ w.readT+=dt; const pg=w.readT%3.6, flip=pg<0.5?Math.sin(pg/0.5*Math.PI):0;       // now and then, turn a page
    set(0,0.70,1.52); set(1,0.78+flip*0.28,1.45-flip*0.55); o.head=0.36; o.prop='book'; }
  if(w.dancing){ w.danceT+=dt; const p=w.danceT*CFG.danceBeat, s1=Math.sin(Math.PI*p), s2=Math.sin(2*Math.PI*p);
    o.squat=2.2+2.6*(0.5-0.5*Math.cos(2*Math.PI*p)); o.sway=3.2*s1; o.lean=-0.10*s1; o.head=0.12*s2;
    set(1,1.7+0.95*s1,1.3+0.45*s2); set(0,1.7-0.95*s1,1.3-0.45*s2);
    o.tap=[Math.max(0,s2)*0.42,Math.max(0,-s2)*0.42]; o.rate=18; }
  if(w.jump){ set(0,-0.7,0.25); set(1,-0.85,0.25); o.lean=0.13; o.squat=Math.max(o.squat,CFG.squatJump); o.rate=24; o.prop=null; }
  if(w.mode==='air'){ const up=w.vy<0, fwd=Math.abs(w.vx)>20;
    if(up){ set(0,2.2,0.2); set(1,2.55,0.15); } else { set(0,1.0,0.55); set(1,1.35,0.5); }
    o.lean=fwd?(up?0.14:-0.06):0; o.rate=16; o.prop=null; }
  const A=w.act;
  if(A){ A.t+=dt;
    if(A.name==='throw'){
      if(A.t<0.24){ set(1,-1.75,-1.2); set(0,0.95,0.3); o.lean=-0.17; o.rate=17; o.leanRate=14; o.prop='stone'; }
      else if(A.t<0.36){ set(1,2.0,0.1); set(0,-0.5,0.5); o.lean=0.30; o.rate=40; o.leanRate=26; if(A.t<0.30) o.prop='stone'; }
      else { set(1,0.8,0.4); set(0,-0.2,0.4); o.lean=0.10; o.rate=11; }
      if(A.t>=0.30&&!A.done){ A.done=true; const h=w.last?w.last.arms[1]:{hx:w.x,hy:w.y-20}, F=w.facing;
        w.shots.push({x:h.hx+F*1.5,y:h.hy-1,vx:F*CFG.throwVx+w.vx*0.6,vy:CFG.throwVy,a:0,rest:false,life:4});
        w.events.push({type:'throw'}); }
      if(A.t>0.66) w.act=null;
    }else if(A.name==='clap'){
      const f=3.4, u=A.t-0.16, s=u<0?1:0.5+0.5*Math.cos(2*Math.PI*f*u);           // s: how far apart the hands are
      set(1,1.02+s*0.32,1.35-s*0.28); set(0,1.02-s*0.30,1.35+s*0.10); o.rate=30; o.squat=Math.max(o.squat,0.9*(1-s)); o.head=-0.05; o.prop=null;
      if(u>=(A.n+0.5)/f){ A.n++; w.events.push({type:'clap'}); }
      if(A.n>=4&&u>=4/f+0.05) w.act=null;
    }
  }
  return o;
}

/* =====================  JUMPING  ===================== */
function launch(w,input){
  w.mode='air'; w.jump=null; w.vy=-CFG.jumpV; w.squat=0;
  if(Math.abs(input)>0.3) w.vx=w.dir*Math.max(Math.abs(w.vx),CFG.jumpRun*(0.55+0.45*Math.abs(input)));   // a held direction makes it a leap
  for(const f of w.feet){ f.planted=false; f.lx=f.ax-w.x; f.ly=f.ay-w.y; f.face=w.facing; }
  w.events.push({type:'jump'});
}
function stepAir(w,world,input,dt,o){
  const F=w.facing, up=w.vy<0;
  w.vy+=CFG.gravity*dt; w.vx+=input*45*dt;
  let nx=clamp(w.x+w.vx*dt,world.x0,world.x1); const ny=w.y+w.vy*dt;
  // legs: tuck on the way up, reach for the ground on the way down (further with the foot that is over lower ground)
  const g=[world.yAt(nx+w.feet[0].lx),world.yAt(nx+w.feet[1].lx)], gHi=Math.min(g[0],g[1]), dMax=Math.min(Math.max(g[0],g[1])-gHi,10);
  const lyLow=Math.min(28.4,26.5+dMax), reach=clamp(Math.abs(w.vx)*0.06,0,4.5);
  for(let i=0;i<2;i++){ const f=w.feet[i], lead=i===1;
    const tx=F*(up?(lead?5:-5.5):(lead?3+reach:-2.5+reach*0.5)), ty=up?(lead?20:23):lyLow-(dMax-Math.min(g[i]-gHi,10));
    f.lx+=(tx-f.lx)*(1-Math.exp(-11*dt)); f.ly+=(ty-f.ly)*(1-Math.exp(-(up?10:17)*dt));
    const d=Math.hypot(f.lx,f.ly); if(d>LMAX-0.6){ f.lx*=(LMAX-0.6)/d; f.ly*=(LMAX-0.6)/d; }
    f.pitch+=((up?0.55:0.12)-f.pitch)*(1-Math.exp(-12*dt)); }
  // a riser taller than we can clear stops us dead
  const sgn=Math.sign(w.vx)||F, probe=nx+sgn*(Math.max(Math.abs(w.feet[0].lx),Math.abs(w.feet[1].lx))+CFG.footToe+1);
  const sole=ny+Math.max(w.feet[0].ly,w.feet[1].ly)+CFG.ankleH;
  if(world.yAt(probe)<sole-4){ nx=w.x; w.vx=0; }
  w.x=nx; w.y=ny;
  for(const f of w.feet){ f.ax=w.x+f.lx; f.ay=w.y+f.ly; }
  upper(w,dt,o,clamp(Math.abs(w.vx)/CFG.walkSpeed,0,1),0);
  w.label='in the air';
  if(w.vy>0){ let pen=-Infinity; for(const f of w.feet) pen=Math.max(pen,f.ay+CFG.ankleH-world.yAt(f.ax));
    if(pen>=0){ w.y-=pen; for(const f of w.feet) f.ay-=pen; land(w,world); } }
}
function land(w,world){
  w.mode='walk'; w.des=w.y; w.landSquat=clamp(w.vy/24,3,9.5); w.landHold=0.10;
  w.events.push({type:'land',speed:w.vy,stone:world.s[world.indexAt(w.x)].w<40}); w.vy=0;
  for(const f of w.feet){ const si=world.indexAt(f.ax), r=footRange(world,si,w.facing);     // each boot gets a few frames to find a legal spot
    f.py=world.s[si].y; aim(w,world,f,si,clamp(f.ax,r[0],r[1]),0.07,true,0); }
}

/* =====================  CRAWLING: two hands and two knees, each planted until the body has moved past it  ===================== */
function crawlLimbs(w,world){
  const F=w.facing, mk=(rest,off)=>{ const x=w.x+F*(rest+off); return {rest:rest,x:x,y:world.yAt(x),planted:true,t:0,sx:0,sy:0,tx:x,ty:0}; };
  w.crawl={hands:[mk(20.5,2.4),mk(20.5,-2.4)],knees:[mk(1.5,-2.4),mk(1.5,2.4)],pitch:w.crawl?w.crawl.pitch:0.4};
}
function enterCrawl(w,world){ startFade(w,0.40); w.mode='crawl'; w.reading=w.dancing=false; w.act=null; w.jump=null; w.vx*=0.3; crawlLimbs(w,world); w.events.push({type:'pat'}); }
function standUp(w,world){
  startFade(w,0.45); w.mode='walk'; w.crawl=null; w.roll=null;
  const si=world.indexAt(w.x), r=footRange(world,si,w.facing);
  w.feet.forEach((f,i)=>{ f.planted=true; f.settle=false; f.si=si; f.py=world.s[si].y; f.px=clamp(w.x+(i?1.6:-1.6),r[0],r[1]); f.face=w.facing; f.heel=f.landPitch=f.pitch=0;
    const a=ankleFor(f.px,f.py,0,f.face); f.ax=a[0]; f.ay=a[1]; });
  w.des=w.y; w.by=w.y; w.bv=0; w.kneeF=w.facing; w.squat=0;
}
function stepCrawl(w,world,input,dt){
  if(input&&Math.sign(input)!==w.facing){ startFade(w,0.32); w.facing=w.dir=Math.sign(input); crawlLimbs(w,world); }   // shuffle round
  const F=w.facing, c=w.crawl;
  const slow=Math.min(world.s[world.indexAt(w.x)].w,world.s[world.indexAt(w.x+F*20)].w)<40?0.7:1;
  w.vx+=clamp(input*CFG.crawlSpeed*slow-w.vx,-CFG.crawlAccel*dt,CFG.crawlAccel*dt);
  w.x=clamp(w.x+w.vx*dt,world.x0,world.x1);
  for(const set of [c.hands,c.knees]) for(let i=0;i<2;i++){ const L=set[i], other=set[1-i];
    if(!L.planted){ L.t+=dt/0.26; const u=ss(L.t); L.x=lerp(L.sx,L.tx,u); L.y=lerp(L.sy,L.ty,u)-(set===c.hands?3:1.6)*Math.sin(Math.PI*clamp(L.t,0,1));
      if(L.t>=1){ L.planted=true; L.x=L.tx; L.y=L.ty; if(set===c.hands) w.events.push({type:'pat'}); } }
    else if(other.planted && (w.x+F*L.rest-L.x)*F>CFG.crawlStride/2 && Math.abs(w.vx)>1){
      let tx=w.x+F*(L.rest+CFG.crawlStride/2)+w.vx*0.26; const s=world.s[world.indexAt(tx)];
      tx=s.w<5?(s.x0+s.x1)/2:clamp(tx,s.x0+2.4,s.x1-2.4);
      L.planted=false; L.t=0; L.sx=L.x; L.sy=L.y; L.tx=tx; L.ty=s.y; } }
  // hips hang between the knees, shoulders between the hands; the spine takes whatever slope that gives
  let hy=-Infinity; for(const K of c.knees){ const dx=Math.min(Math.abs(K.x-w.x),12); hy=Math.max(hy,K.y-1.8-Math.sqrt(CFG.thigh*CFG.thigh-dx*dx)); }
  w.y+=(hy-w.y)*(1-Math.exp(-11*dt));
  const shY=(c.hands[0].y+c.hands[1].y)/2-17.3, pT=Math.acos(clamp((w.y-shY)/CFG.torso,-0.4,0.97));
  c.pitch+=(pT-c.pitch)*(1-Math.exp(-10*dt));
  const hip={x:w.x,y:w.y}, tx=F*Math.sin(c.pitch), ty=-Math.cos(c.pitch);
  const neck={x:hip.x+tx*CFG.torso,y:hip.y+ty*CFG.torso}, sh={x:neck.x-tx*2.4,y:neck.y-ty*2.4};
  const ha=F*(c.pitch-0.8), hl=CFG.neck+CFG.headR, head={x:neck.x+Math.sin(ha)*hl,y:neck.y-Math.cos(ha)*hl,a:F*0.3};
  const legs=[],arms=[];
  for(let i=0;i<2;i++){
    const K=c.knees[i], k=bone(hip.x,hip.y,K.x,K.y-1.8,CFG.thigh), bx=k[0]-F*CFG.shin, a=bone(k[0],k[1],bx,world.yAt(bx)-2,CFG.shin);
    legs.push({kx:k[0],ky:k[1],ax:a[0],ay:a[1],pitch:2.6,face:F});                    // boot laid back, sole up
    const H=c.hands[i], e=solve2(sh.x,sh.y,H.x,H.y-1.4,CFG.upperArm,CFG.foreArm,-F);
    arms.push({ex:e.kx,ey:e.ky,hx:e.ax,hy:e.ay});
  }
  w.lean=F*c.pitch; w.label='crawling';
  return {hip:hip,neck:neck,head:head,sh:sh,legs:legs,arms:arms,face:F,prop:null};
}

/* =====================  TUMBLE ROLL: one tucked shape turned through a full circle, kept resting on the ground  ===================== */
const TUCK=(function(){
  const hip=[-8,4], P=(p,ang,len)=>[p[0]+Math.sin(ang)*len,p[1]+Math.cos(ang)*len];      // ang measured from straight down, forward +
  const neck=P(hip,Math.PI-1.3,CFG.torso), sh=[neck[0]-(neck[0]-hip[0])/CFG.torso*2.4,neck[1]-(neck[1]-hip[1])/CFG.torso*2.4];
  const head=P(neck,Math.PI-2.75,CFG.neck+CFG.headR), knee=P(hip,2.05,CFG.thigh), ankle=P(knee,-0.75,CFG.shin);
  const elbow=P(sh,-0.1,CFG.upperArm), hand=P(elbow,1.5,CFG.foreArm);
  const T={hip:hip,neck:neck,sh:sh,head:head,knee:knee,ankle:ankle,elbow:elbow,hand:hand}, pad={hip:5.6,neck:5.2,sh:0,head:CFG.headR+0.6,knee:2.8,ankle:4,elbow:2.2,hand:2.2};
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const n in T){ x0=Math.min(x0,T[n][0]-pad[n]); x1=Math.max(x1,T[n][0]+pad[n]); y0=Math.min(y0,T[n][1]-pad[n]); y1=Math.max(y1,T[n][1]+pad[n]); }
  for(const n in T){ T[n][0]-=(x0+x1)/2; T[n][1]-=(y0+y1)/2; }                          // turn about the middle of the ball
  T.pad=pad; return T;
})();
function canRoll(w,world){ const g=world.yAt(w.x); for(let k=8;k<=CFG.rollDist+10;k+=6) if(world.yAt(w.x+w.facing*k)<g-3) return false; return true; }
function startRoll(w,world){ startFade(w,0.15); w.mode='roll'; w.dancing=false; w.act=null; w.jump=null; w.roll={t:0,cy:null}; w.events.push({type:'roll'}); }
function stepRoll(w,world,input,dt){
  const r=w.roll, F=w.facing, T=CFG.rollTime; r.t+=dt; const s=clamp(r.t/T,0,1);
  w.vx=F*CFG.rollDist/T*(1.2-0.4*s); w.x=clamp(w.x+w.vx*dt,world.x0,world.x1);

function freshSave(){ return {v:1,flags:{},inv:{},met:{},rooms:{},pages:{},eggs:{},signoffs:{},terms:{},gates:{},points:0,time:0,done:false,pos:{node:'ground',x:1150}}; }
const count=o=>Object.keys(o).length;
function percent(S){ return Math.floor(S.points/MAXPTS*100); }
function rank(S){ const p=percent(S); let r=RANKS[0][1]; for(const k of RANKS) if(p>=k[0]) r=k[1]; return r; }
function mainSteps(S){ return (S.flags.started?1:0)+(S.inv.badge?1:0)+count(S.signoffs)+(S.inv.tunnelkey?1:0)+(S.done?1:0); }   // 0..10
function clock(S){ const m=18*60+Math.round(mainSteps(S)/10*360), h=Math.floor(m/60)%24, mm=m%60; return ((h%12)||12)+':'+(mm<10?'0':'')+mm+(h>=12&&h<24&&m<24*60?' PM':' AM'); }

function objective(S){
  if(!S.flags.started) return 'Find Rianan in the War Room. HQ, 2nd floor: hold Up on the stair landing.';
  if(!S.inv.badge){ if(!S.flags.rfcAsked) return 'See Andrew at the Help Desk (HQ ground floor) about a Level 2 badge.';
    return S.inv.rfc?'Bring the RFC form back to Andrew at the Help Desk.':'Fetch the RFC form from the printer in the Dev Bullpen (2nd floor).'; }
  if(count(S.signoffs)<6) return 'Collect sign-offs from the system owners: '+count(S.signoffs)+' of 6. The Journal lists who needs what.';
  if(!S.inv.tunnelkey) return 'Greg in the Legacy Archive (HQ basement) trades the tunnel key for 6 ledger pages: '+count(S.pages)+' found.';
  if(!S.done) return 'Take the old tunnel west of Basement Storage, and keep going down until you find A+.';
  return 'Cutover complete. Keep exploring: '+percent(S)+'% of Hecktown found.';
}
function tasks(S){

  so('Catalog','Pam and Melissa','Item Maintenance, HQ 3rd floor',S.flags.catalogAsked,S.inv.label?'Bring the label to Pam.':'They need a SKU label sample from the Top Rack Catwalk in the warehouse.');
  so('EDI','Umesh','EDI & Integration, HQ 2nd floor',S.flags.ediAsked,S.inv.bol?'Bring the bill of lading to Umesh.':'Get tonight\'s bill of lading from Rosa at the Receiving Dock.');
  so('Storefront','Ash','Dev Bullpen, HQ 2nd floor',S.flags.sfAsked,S.inv.coffee?'Bring the coffee to Ash.':'Ash needs a coffee from Tina\'s Tacos, out in the west lot.');
  so('Jobs','John','Accounting, HQ 3rd floor',S.flags.jobsAsked,count(S.terms)>=3?'All three queues held. Tell John.':'Hold the job queue at three green-screen terminals: '+TERMS.map(x=>x.where+(S.terms[x.id]?' (held)':'')).join(', ')+'.');
  t.push({title:'Bring Biscuit home',status:st(S.flags.biscuitHome,S.flags.biscuitAsked),note:S.flags.biscuitAsked?(S.inv.treats?'Biscuit is up in the Dog Park. Offer a treat.':'Biscuit won\'t come without a treat. Customer Care keeps a jar.'):'Optional. Bret is in the warehouse Pick Aisles.'});

  t.push({title:'Good night, A+',status:st(S.done,S.inv.tunnelkey),note:'All six sign-offs open the last door, three levels down.'});
  return t;
}

/* ---------------- a running game ---------------- */
function create(save){
  const S=save||freshSave();
  const G={S:S,events:[],dialog:null,npcs:[],target:null,hintT:0,biscuit:null,autoT:0,stairHint:null};
  const n=MAP.nodes[S.pos.node]||MAP.nodes.ground;
  G.cur={node:n,world:n.world};
  G.hero=E.createWalker(n.world,clamp(S.pos.x,n.world.hx0,n.world.hx1));
  for(const g of MAP.gates) g.open=!!S.gates[g.id];
  for(const p of PEOPLE){ const nd=MAP.nodes[p.node]; G.npcs.push({def:p,node:nd,w:E.createWalker(nd.world,p.x),pose:null,goal:p.x,wait:1+Math.random()*5,live:false}); }
  for(const q of G.npcs){ q.w.facing=q.w.dir=q.w.kneeF=(q.def.x>1500?-1:1); q.pose=E.poseOf(q.w); }
  G.biscuit={x:S.flags.biscuitHome?BISCUIT.homeX:BISCUIT.x,t:0,run:0};
  G.pose=E.poseOf(G.hero);
  return G;
}
function award(G,pts,text){ G.S.points+=pts; G.events.push({type:'banner',text:text,pts:pts}); }
function say(G,who,pages,opt){ G.dialog=Object.assign({who:who.name,role:who.role||'',look:who.look||null,pages:pages,i:0},opt||{}); G.events.push({type:'sfx',name:'talk'}); }
function signoff(G,name){ G.S.signoffs[name]=1; award(G,PTS.signoff,'Sign-off: '+name+' ('+count(G.S.signoffs)+' of 6)'); G.events.push({type:'sfx',name:'good'}); G.events.push({type:'save'}); }

/* ---------------- what can be used from here ---------------- */

    if(G.cur.link){ const L=G.cur.link;
      for(const k of ['lo','hi']){ const e=L[k], away=(k==='lo'?-1:1)*L.dir, into=(k==='lo'?iy<0:iy>0)&&!(ix&&Math.sign(ix)===away);

    }else if(iy){ const k=iy<0?'lo':'hi';

        if(h.x>e.a+2&&h.x<e.b-2&&feetIn(h,e.a,e.b)){ G.cur={link:L,world:L.world}; moved=true; break; } }

}

  if(iy&&!ix){ let best=null,bd=170; for(const e of endsFor(G,iy)){ const c=(e.a+e.b)/2, d=Math.abs(c-h.x); if(d<bd){bd=d;best=e;} }
    if(best){ const c=(best.a+best.b)/2; if(Math.abs(c-h.x)>5) ix=Math.sign(c-h.x)*(Math.abs(c-h.x)>30?1:0.55); } }

    if(h.mode!=='crawl') for(const d of MAP.ducts) if(d.node===N.id){ if(h.x<=d.x0) x1=Math.min(x1,d.x0-10); else if(h.x>=d.x1) x0=Math.max(x0,d.x1+10); } }

  if(ok&&name==='roll'&&!G.S.eggs.roll){ G.S.eggs.roll=1; award(G,PTS.egg,'Stop, drop and roll'); }

/* ---------------- one fixed step ---------------- */
function update(G,ix,iy,dt){
  const S=G.S, h=G.hero; S.time+=dt;
  if(G.dialog){ ix=0; iy=0; }
  if(iy&&(G.cur.link||(G.cur.node&&G.cur.node.mid))) ix=0;   // on the stairs, up and down win over left and right
  if(G.cur.node&&G.cur.node.mid&&ix<0&&!iy) iy=1;          // walking off a half-landing with no choice made: take the flight down
  if(G.readT>0){ G.readT-=dt; if(G.readT<=0&&h.reading&&!G.dialog) E.command(h,G.cur.world,'read'); }
  transit(G,ix,iy);
  const sx=steer(G,ix,iy);
  setLimits(G);
  const px=h.x;
  G.pose=E.updateWalker(h,G.cur.world,sx,dt);
  const w=G.cur.world; if(sx&&Math.abs(h.x-px)<1e-4&&(h.x<=w.x0+0.01||h.x>=w.x1-0.01)&&(w.x0>w.hx0||w.x1<w.hx1)) G.bump=1;
  w.x0=w.hx0; w.x1=w.hx1;
  G.hintT-=dt; if(G.bump&&G.hintT<=0&&G.cur.node){ G.hintT=3.5; let msg=null;
    for(const g of MAP.gates) if(g.node===G.cur.node.id&&!g.open&&Math.abs(g.x-h.x)<24) msg=g.label+' is locked.';
    for(const d of MAP.ducts) if(d.node===G.cur.node.id&&h.x>d.x0-24&&h.x<d.x1+24) msg='Too low to walk under. Get down and crawl.';
    if(msg) G.events.push({type:'hint',text:msg}); }
  transit(G,ix,iy);

  const N=G.cur.node;
  if(N){
    for(const r of MAP.rooms) if(r.node===N.id&&!S.rooms[r.id]&&h.x>r.x0+6&&h.x<r.x1-6){ S.rooms[r.id]=1; award(G,PTS.room,'Discovered: '+r.name); G.events.push({type:'save'});
      if(r.name==='HVAC Duct'||r.name==='Collapsed Section'){ if(!S.eggs.duct){ S.eggs.duct=1; award(G,PTS.duct,'Tight squeeze'); } } }
    for(const g of MAP.gates) if(g.node===N.id&&!g.open&&Math.abs(g.x-h.x)<26&&needMet(S,g)) openGate(G,g);
    if(S.pos.node!==N.id||Math.abs(S.pos.x-h.x)>1){ S.pos.node=N.id; S.pos.x=Math.round(h.x); }
  }
  G.room=null; if(N) for(const r of MAP.rooms) if(r.node===N.id&&h.x>=r.x0&&h.x<=r.x1){ G.room=r; break; }
  G.target=findTarget(G);
  G.stairHint=null; if(N&&h.mode==='walk'){ for(const L of MAP.links) for(const k of ['lo','hi']){ const e=L[k]; if(e.node===N&&h.x>e.a-10&&h.x<e.b+10){ G.stairHint=G.stairHint||{x:(e.a+e.b)/2,up:false,down:false}; if(k==='lo')G.stairHint.up=true; else G.stairHint.down=true; } } }

  for(const q of G.npcs){
    const near=Math.abs(q.w.x-h.x)<900; q.live=near; if(!near) continue;
    let inp=0; const p=q.def, same=q.node===N, dx=h.x-q.w.x;
    if(q.clap>0){ q.clap-=dt; if(q.clap<=0) E.command(q.w,q.node.world,'clap'); }
    if(same&&Math.abs(dx)<70){ if(Math.sign(dx)!==q.w.facing&&Math.abs(dx)>8) inp=0.09*Math.sign(dx); q.wait=Math.max(q.wait,1.5); }
    else if(p.wander){ q.wait-=dt; if(q.wait<=0){ if(Math.abs(q.goal-q.w.x)<6){ q.goal=p.wander[0]+Math.random()*(p.wander[1]-p.wander[0]); q.wait=2+Math.random()*7; } else inp=Math.sign(q.goal-q.w.x)*0.5; } }
    q.pose=E.updateWalker(q.w,q.node.world,inp,dt); q.w.events.length=0;
  }
  // Biscuit
  const b=G.biscuit; b.t+=dt; if(b.run){ b.x+=260*dt; if(b.x>=BISCUIT.homeX){ b.x=BISCUIT.homeX; b.run=0; } }
}

  const S=G.S; $('hClock').textContent=GM.clock(S); $('hPlace').textContent=G.room?G.room.name:(G.cur.link||(G.cur.node&&G.cur.node.mid)?'On the stairs':G.cur.node.label);
  $('hGoal').textContent=GM.objective(S); $('hPts').textContent=S.points+' / '+GM.MAXPTS; $('hRank').textContent=GM.percent(S)+'%  ·  '+GM.rank(S); $('hBar').style.width=GM.percent(S)+'%';
  const h=G.hero; for(const b of document.querySelectorAll('#pad button[aria-pressed]')){ const a=b.dataset.act; b.setAttribute('aria-pressed',a==='crawl'?h.mode==='crawl':(a==='read'?h.reading:h.dancing)); }
}
function dialogUI(){
  const d=G.dialog, box=$('dialog');
  document.body.classList.toggle('talking',!!d);
  if(!d){ if(shownDialog){ box.classList.add('hide'); shownDialog=null; } return; }
  if(shownDialog===d&&shownPage===d.i) return; shownDialog=d; shownPage=d.i; box.classList.remove('hide');
  const term=d.who==='A+'||d.who==='Terminal'; box.classList.toggle('term',term);
  $('dwho').innerHTML=''; $('dwho').appendChild(document.createTextNode(d.who)); const r=document.createElement('span'); r.textContent=d.role; $('dwho').appendChild(r);
  $('dtext').textContent=d.pages[d.i];
  const fc=$('dface').getContext('2d'); fc.setTransform(1,0,0,1,0,0); fc.clearRect(0,0,112,112);
  if(d.look) PP.portrait(fc,d.look,112); else { fc.fillStyle=term?'#0a1a0e':'#2c3340'; fc.fillRect(0,0,112,112); fc.fillStyle=term?'#6fe08a':'#f2b544'; fc.font='700 44px "IBM Plex Mono",monospace'; fc.textAlign='center'; fc.textBaseline='middle'; fc.fillText(d.who==='A+'?'A+':(d.who==='Biscuit'?'🐾':(d.who==='The Ledger'?'§':'>_')),56,58); }
  const last=d.i>=d.pages.length-1, ch=$('dchoices'); ch.innerHTML='';
  if(last&&d.choices) d.choices.forEach((c,i)=>{ const b=document.createElement('button'); b.textContent=(V.touch?'':(i+1)+'  ')+c.label; b.addEventListener('click',e=>{ e.stopPropagation(); pick(i); }); ch.appendChild(b); });
  $('dmore').textContent=last&&d.choices?'':(V.touch?'Tap to continue':'E or Space to continue')+(d.pages.length>1?'   '+(d.i+1)+' / '+d.pages.length:'');
}
function pick(i){ if(G.dialog&&G.dialog.choices&&G.dialog.i>=G.dialog.pages.length-1){ GM.advance(G,i); } }
$('dialog').addEventListener('click',()=>{ wake(); if(G&&G.dialog) queue.push('use'); });

/* ---------------- journal and ending ---------------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function statsHTML(S){ const st=(n,l)=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>', m=Math.floor(S.time/60);
  return '<div class="stats">'+st(S.points+' / '+GM.MAXPTS,'points, '+GM.percent(S)+'%')+st(GM.count(S.signoffs)+' / 6','sign-offs')+st(GM.count(S.rooms)+' / '+MAP.rooms.length,'places found')+st(GM.count(S.met)+' / '+GM.PEOPLE.length,'people met')+st(GM.count(S.pages)+' / '+GM.PAGES.length,'ledger pages')+st((m>=60?Math.floor(m/60)+'h ':'')+(m%60)+'m','on the clock')+'</div>'; }
function journalHTML(){
  const S=G.S; let h='<button class="btn ghost close" id="jClose">Close</button><h1>Journal</h1><div class="sub">'+esc(GM.rank(S))+'  ·  '+esc(GM.clock(S))+'  ·  progress saves on its own</div>'+statsHTML(S);
  h+='<h3>Cutover checklist</h3>'; for(const t of GM.tasks(S)) h+='<div class="task '+t.status+'"><span class="mark">'+(t.status==='done'?'[x]':(t.status==='active'?'[>]':'[ ]'))+'</span><div>'+esc(t.title)+'<small>'+esc(t.note)+'</small></div></div>';
  h+='<h3>Places</h3><div class="places">'; const groups=[['Outside',r=>r.node==='ground'&&(r.x1<=1100||(r.x0>=1900&&r.x1<=2200)||r.x0>=3200)],['Phillips HQ',r=>r.node.indexOf('hq_')===0&&!r.dark||(r.node==='ground'&&r.x0>=1100&&r.x1<=1900)],['Lou\'s Garage',r=>r.node==='gar_loft'],['Easton DC',r=>r.node.indexOf('wh_')===0||(r.node==='ground'&&r.x0>=2200&&r.x1<=3160)],['Underneath',r=>!!r.dark]];
  for(const g of groups){ const rs=MAP.rooms.filter(g[1]); if(!rs.length) continue; h+='<div><b>'+esc(g[0])+'  '+rs.filter(r=>S.rooms[r.id]).length+'/'+rs.length+'</b>'+rs.map(r=>S.rooms[r.id]?'<div>'+esc(r.name)+'</div>':'<div class="un">? ? ?</div>').join('')+'</div>'; } h+='</div>';
  h+='<h3>The ledger</h3>'; let any=false; GM.PAGES.forEach((p,i)=>{ if(S.pages[i]){ any=true; h+='<div class="page">'+esc(p[2])+'</div>'; } }); if(!any) h+='<div class="sub">No pages yet. They turn up in corners, lofts and places you have to crawl into.</div>';
  h+='<h3>Controls</h3><div class="keys">'+keysHTML()+'</div>'; return h;
}
function keysHTML(){ return V.touch?'Drag a thumb on the left to walk. Push up or down on a stair landing to take the stairs. Use talks, takes and opens. More holds roll, throw, read, dance and clap.'
  :'<kbd>←</kbd> <kbd>→</kbd> walk (<kbd>Shift</kbd> stroll)  ·  <kbd>↑</kbd> <kbd>↓</kbd> take the stairs from a landing  ·  <kbd>E</kbd> talk, take, open  ·  <kbd>Space</kbd> jump  ·  <kbd>C</kbd> crawl  ·  <kbd>X</kbd> roll  ·  <kbd>F</kbd> throw  ·  <kbd>R</kbd> read  ·  <kbd>G</kbd> dance  ·  <kbd>V</kbd> clap  ·  <kbd>J</kbd> journal  ·  <kbd>Z</kbd> zoom  ·  <kbd>M</kbd> sound. Controllers work too.'; }
function toggleJournal(){ if(state==='play'){ state='journal'; $('jBody').innerHTML=journalHTML(); $('journal').classList.remove('hide'); $('journal').scrollTop=0; $('jClose').onclick=toggleJournal; save(); }
  else if(state==='journal'){ state='play'; $('journal').classList.add('hide'); } }
function showEnding(){ state='ending'; const S=G.S;
  $('eBody').innerHTML='<h1>Good night, A+</h1><div class="sub">ENDSBS *ALL  ·  completed normally  ·  '+esc(GM.clock(S))+'</div><p style="font-size:16px;line-height:1.6;max-width:56ch">Forty years of orders, archived with six signatures and nobody raising their voice. Upstairs the new system takes its first order without ceremony. The trucks roll at dawn.</p>'+statsHTML(S)+
   '<p class="sub" style="margin-top:16px">'+(GM.percent(S)>=100?'Every room, every page, every person. Hecktown Legend.':'There is more campus out there: '+(MAP.rooms.length-GM.count(S.rooms))+' places, '+(GM.PAGES.length-GM.count(S.pages))+' ledger pages and '+(GM.PEOPLE.length-GM.count(S.met))+' people you have not found yet.')+'</p><div class="btns"><button class="btn" id="eGo">Keep exploring</button></div>';
  $('ending').classList.remove('hide'); $('eGo').onclick=closeEnding; SFX.good(); }
function closeEnding(){ state='play'; $('ending').classList.add('hide'); }

/* ---------------- title ---------------- */
function begin(saveData){ G=GM.create(saveData||undefined); state='play'; document.body.classList.add('play'); $('title').classList.add('hide'); $('hud').classList.remove('hide'); $('tools').classList.remove('hide');
  V.camx=G.hero.x; V.camy=G.cur.world.yAt(G.hero.x)-34; hud(); if(!saveData) toast('Cutover night. 6:00 PM. Rianan wants you upstairs.'); save(); }
function refreshTitle(){ const s=loadSave(); $('bContinue').classList.toggle('hide',!s); $('bNew').classList.toggle('ghost',!!s);
  $('resume').textContent=s?('Saved game: '+GM.percent(s)+'%, '+GM.rank(s)+', '+GM.clock(s)+' on cutover night.'):''; $('keysHelp').innerHTML=keysHTML(); }
$('bContinue').onclick=()=>{ wake(); begin(loadSave()); };
let armNew=false; $('bNew').onclick=()=>{ wake(); if(loadSave()&&!armNew){ armNew=true; $('bNew').textContent='Erase the save and start over?'; return; } wipe(); begin(null); };
$('score').onclick=toggleJournal; $('bJournal').onclick=toggleJournal;
$('bZoom').onclick=()=>{ zi=(zi+1)%zoomStops.length; };
$('bSnd').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'Sound on':'Sound off'; wake(); if(master) master.gain.value=soundOn?1:0; };

/* ---------------- main loop ---------------- */
function resize(){ V.DPR=Math.min(window.devicePixelRatio||1,2); V.W=innerWidth; V.H=innerHeight; cv.width=Math.round(V.W*V.DPR); cv.height=Math.round(V.H*V.DPR); }
addEventListener('resize',resize); resize();
const STEP=1/120; let last=performance.now(), acc=0, autosave=0, zoomNow=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if(state==='play'){
    const inp=readInput();
    while(queue.length){ const a=queue.shift(); if(a==='use') GM.interact(G); else GM.command(G,a); }
    acc+=dt; while(acc>=STEP){ GM.update(G,inp[0],inp[1],STEP); acc-=STEP; }
    const hard=!(G.cur.node&&G.cur.node.id==='ground'&&G.hero.x<548); for(const ev of G.hero.events) footfall(ev,hard); G.hero.events.length=0;
    for(const ev of G.events){ if(ev.type==='banner'){ toast(ev.text,ev.pts); if(ev.pts) SFX.point(); } else if(ev.type==='hint') toast(ev.text,0,true); else if(ev.type==='sfx'){ if(SFX[ev.name]) SFX[ev.name](); } else if(ev.type==='save') save(); else if(ev.type==='ending') showEnding(); }
    G.events.length=0;
    autosave+=dt; if(autosave>20){ autosave=0; save(); }
    hudT-=dt; if(hudT<=0){ hudT=0.15; hud(); } dialogUI();
  } else { readInput(); queue.length=0; acc=0; }
  if(saveBlip>0){ saveBlip-=dt; if(saveBlip<=0) $('saved').classList.remove('on'); }
  if(AC) tickMusic();

  const h=G.hero, w=G.cur.world, target=Math.min(V.H/zoomStops[zi],V.W/250); zoomNow=zoomNow?zoomNow+(target-zoomNow)*(1-Math.exp(-6*dt)):target; V.zoom=zoomNow;
  if(state==='title'){ V.camx=1330+Math.sin(now/9000)*160; V.camy=-110; }
  else{ V.camx+=(h.x+h.facing*24+h.vx*0.25-V.camx)*(1-Math.exp(-3.2*dt)); const standY=w.yAt(h.x)-34; V.camy+=(standY+(Math.min(h.y,standY+3)-standY-3)*0.35-V.camy)*(1-Math.exp(-2.8*dt)); }
  V.quiet=state==='title'; DRAW.render(ctx,V,G,now,dt);
  if(stick&&state==='play'){ ctx.setTransform(V.DPR,0,0,V.DPR,0,0); const kx=clamp(stick.x-stick.ox,-52,52), ky=clamp(stick.y-stick.oy,-52,52); ctx.lineWidth=2; ctx.strokeStyle='rgba(246,236,216,.5)'; ctx.beginPath(); ctx.arc(stick.ox,stick.oy,52,0,7); ctx.stroke();
    ctx.fillStyle='rgba(242,181,68,.85)'; ctx.beginPath(); ctx.arc(stick.ox+kx,stick.oy+ky,20,0,7); ctx.fill(); }
  requestAnimationFrame(frame);
}
G=GM.create(loadSave()||undefined); refreshTitle();
window.__hecktown={get G(){return G;},V:V,begin:begin};     // for the browser tests
requestAnimationFrame(frame);
})();

</script>
